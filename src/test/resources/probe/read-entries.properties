# The -show_entries of the probe's first-frames and first-packets reads, which record-fixtures.sh
# records with and RecordedFfprobe answers: the frames' read prints only the side data fields that
# the probe reads, so that a Dolby Vision frame's reshaping curves stay out of its output.
frames=frame=stream_index:frame_side_data=side_data_type,red_x,red_y,green_x,green_y,blue_x,blue_y,white_point_x,white_point_y,min_luminance,max_luminance,max_content,max_average,vdr_rpu_profile,bl_video_full_range_flag,el_spatial_resampling_filter_flag,disable_residual_flag,vdr_bit_depth
packets=packet=pts,data:packet_side_data=side_data_type
