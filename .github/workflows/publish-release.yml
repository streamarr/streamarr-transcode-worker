name: Release Publisher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to retry (vX.Y.Z)
        required: true
        type: string
  release:
    types:
      - released

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release version and revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: zulu
          cache: maven

      - name: Verify tagged Maven version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          revision="$(git rev-parse HEAD)"
          tagged_revision="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${revision}" != "${tagged_revision}" ]]; then
            echo "::error::Release tag does not match the checked-out revision"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${revision}" origin/main; then
            echo "::error::Release revision is not an ancestor of main"
            exit 1
          fi
          pom_version="$(./mvnw --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be stable SemVer (vX.Y.Z)"
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != "v${pom_version}" ]]; then
            echo "::error::Release tag and Maven version must agree"
            exit 1
          fi
          release_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')"
          if [[ "${release_draft}" != "false" ]]; then
            echo "::error::Publish the GitHub release before publishing images"
            exit 1
          fi
          echo "version=${pom_version}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

  build_release_images:
    name: Build and verify ${{ matrix.architecture }} image
    needs: validate_release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WORKER_IMAGE: streamarr-worker:release-${{ matrix.architecture }}
      IMAGE_VERSION: ${{ needs.validate_release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate_release.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - uses: ./.github/actions/prepare-ffmpeg
      - uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5
      - name: Build the unpublished image and verify its media runtime
        run: .github/actions/pack-build/build-worker-image.sh "$WORKER_IMAGE" "$IMAGE_VERSION"
      - name: Exercise the packaged worker through its public interfaces
        run: >-
          ./mvnw -B verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=WorkerImageIT -Dfailsafe.excludedGroups=SmokeTest
          -Dworker.image="$WORKER_IMAGE" -Djacoco.skip=true
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the verified native image
        shell: bash
        env:
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          native_image="index.docker.io/streamarr/streamarr-transcode-worker:${IMAGE_VERSION}-${IMAGE_ARCHITECTURE}"
          docker tag "${WORKER_IMAGE}" "${native_image}"
          docker push "${native_image}"

  publish_release:
    name: Publish multi-architecture release image
    needs: [validate_release, build_release_images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish immutable multi-architecture image
        shell: bash
        env:
          IMAGE_VERSION: ${{ needs.validate_release.outputs.version }}
        run: |
          immutable_image="index.docker.io/streamarr/streamarr-transcode-worker:${IMAGE_VERSION}"
          docker buildx imagetools create \
            --tag "${immutable_image}" \
            "index.docker.io/streamarr/streamarr-transcode-worker:${IMAGE_VERSION}-amd64" \
            "index.docker.io/streamarr/streamarr-transcode-worker:${IMAGE_VERSION}-arm64"

          platforms="$(docker buildx imagetools inspect --raw "${immutable_image}" \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')"
          grep -Fx "linux/amd64" <<<"${platforms}" >/dev/null
          grep -Fx "linux/arm64" <<<"${platforms}" >/dev/null

      - name: Publish latest multi-architecture image
        env:
          IMAGE_VERSION: ${{ needs.validate_release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest_tag}" != "v${IMAGE_VERSION}" ]]; then
            echo "Keeping latest at ${latest_tag}; published version ${IMAGE_VERSION}."
            exit 0
          fi

          docker buildx imagetools create \
            --tag "index.docker.io/streamarr/streamarr-transcode-worker:latest" \
            "index.docker.io/streamarr/streamarr-transcode-worker:${IMAGE_VERSION}-amd64" \
            "index.docker.io/streamarr/streamarr-transcode-worker:${IMAGE_VERSION}-arm64"
