name: Release Publisher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to retry (vX.Y.Z)
        required: true
        type: string
  release:
    types:
      - released

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release version and revision
    permissions:
      contents: read
    uses: streamarr/streamarr-workflows/.github/workflows/validate-release.yml@768aa58c4d37fd4b049780b01adffdf38feb3b79
    with:
      tag: ${{ inputs.tag || '' }}

  build_release_images:
    name: Build and verify ${{ matrix.architecture }} image
    needs: validate_release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WORKER_IMAGE: streamarr-worker:release-${{ matrix.architecture }}
      IMAGE_VERSION: ${{ needs.validate_release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate_release.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - uses: ./.github/actions/prepare-ffmpeg
      - uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5
      - name: Build the unpublished image and verify its media runtime
        run: .github/actions/pack-build/build-worker-image.sh "$WORKER_IMAGE" "$IMAGE_VERSION"
      - name: Exercise the packaged worker through its public interfaces
        run: >-
          ./mvnw -B verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=WorkerImageIT -Dfailsafe.excludedGroups=SmokeTest
          -Dworker.image="$WORKER_IMAGE" -Djacoco.skip=true
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the verified native image
        shell: bash
        env:
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_REVISION: ${{ needs.validate_release.outputs.revision }}
        run: |
          native_image="index.docker.io/streamarr/streamarr-transcode-worker:sha-${SOURCE_REVISION}-${IMAGE_ARCHITECTURE}"
          docker tag "${WORKER_IMAGE}" "${native_image}"
          docker push "${native_image}"
          reference=$(docker inspect --format '{{ index .RepoDigests 0 }}' "${native_image}")
          jq -n --arg source "${SOURCE_REVISION}" --arg architecture "${IMAGE_ARCHITECTURE}" \
            --arg image "streamarr/streamarr-transcode-worker@${reference##*@}" \
            '{sourceRevision: $source, architecture: $architecture, image: $image}' \
            > "${IMAGE_ARCHITECTURE}-image.json"

      - name: Preserve the native image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-release-${{ matrix.architecture }}-${{ needs.validate_release.outputs.revision }}
          path: ${{ matrix.architecture }}-image.json
          if-no-files-found: error

  publish_release:
    name: Publish multi-architecture release image
    needs: [validate_release, build_release_images]
    permissions:
      contents: read
    uses: streamarr/streamarr-workflows/.github/workflows/publish-image.yml@768aa58c4d37fd4b049780b01adffdf38feb3b79
    with:
      image-repository: streamarr/streamarr-transcode-worker
      source-revision: ${{ needs.validate_release.outputs.revision }}
      version: ${{ needs.validate_release.outputs.version }}
      artifact-pattern: worker-release-*-${{ needs.validate_release.outputs.revision }}
      publication-kind: release
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
