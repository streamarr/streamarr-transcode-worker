name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - uses: ./.github/actions/prepare-ffmpeg
      - name: Verify redistribution tooling
        run: node --test --experimental-test-coverage --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=90 buildpacks/ffmpeg/test/*.test.mjs
      - name: Verify image publication boundaries
        run: |
          node --test .github/actions/pack-build/*.test.mjs
          docker buildx imagetools create --help | grep -q -- --metadata-file
      - name: Verify analysis failure handling
        run: node --test .github/actions/sonar/test/*.test.mjs
      - name: Build and test the executable worker
        run: ./mvnw -B clean verify
      - name: Analyze coverage and require the SonarCloud quality gate
        if: >-
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        env:
          SONAR_TOKEN: ${{ secrets.ORG_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/actions/sonar/analyze.sh

  smoke:
    name: Verify real FFmpeg execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - uses: ./.github/actions/setup-ffmpeg
      - name: Exercise the worker with real media processes
        run: ./mvnw -B test -Dtest=WorkerMediaSmokeTest -Dsurefire.excludedGroups=

  image:
    name: Verify ${{ matrix.architecture }} worker image
    needs: [verify, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WORKER_IMAGE: streamarr-worker:tested-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - uses: ./.github/actions/prepare-ffmpeg
      - uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5
      - name: Build the unpublished image and verify its media runtime
        run: .github/actions/pack-build/build-worker-image.sh "$WORKER_IMAGE"
      - name: Exercise the packaged worker through its public interfaces
        run: >-
          ./mvnw -B verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=WorkerImageIT -Dfailsafe.excludedGroups=SmokeTest
          -Dworker.image="$WORKER_IMAGE" -Djacoco.skip=true
      - name: Log in to Docker Hub after main validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the verified native image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: .github/actions/pack-build/publish-verified-image.sh "$WORKER_IMAGE" "$IMAGE_ARCHITECTURE"
      - name: Preserve the native image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-native-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ matrix.architecture }}-image.json
          if-no-files-found: error
      - name: Preserve image test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-tests-${{ matrix.architecture }}
          path: target/failsafe-reports
          if-no-files-found: ignore

  build:
    name: build
    if: always()
    needs: [verify, smoke, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification and smoke tests
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$IMAGE_RESULT" = success

  publish:
    name: Publish verified multi-architecture image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: worker-native-*-${{ github.sha }}
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the index from this run's verified native digests
        run: .github/actions/pack-build/publish-image-index.sh
      - name: Preserve the immutable worker image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-image-${{ github.sha }}
          path: |
            worker-image.json
            image-index.json
            image-metadata.json
            amd64-image.json
            arm64-image.json
          if-no-files-found: error
