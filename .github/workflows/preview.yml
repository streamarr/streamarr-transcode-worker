name: Preview Image

on:
  issue_comment:
    types:
      - created

permissions: {}

env:
  WORKER_IMAGE: streamarr-worker:preview-amd64

jobs:
  build_preview:
    if: >
      github.event.issue.pull_request
      && github.event.comment.body == '/deploy-preview'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    # Pack cannot read base layers from Docker's containerd image store, which ubuntu-26.04 uses.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.pr_head.outputs.sha }}

    # This job runs pull request code in the default branch's context, so it holds no secrets and
    # writes no cache: a cache entry saved here would be restored by main's builds.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false

      - name: Resolve PR head SHA
        id: pr_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: ./.github/actions/prepare-ffmpeg
      - uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5
      - name: Build the unpublished preview image and verify its media runtime
        env:
          PREVIEW_REVISION: ${{ steps.pr_head.outputs.sha }}
        run: .github/actions/pack-build/build-worker-image.sh "$WORKER_IMAGE" "$PREVIEW_REVISION"

      - name: Archive preview image
        run: |
          set -euo pipefail
          docker image inspect "${WORKER_IMAGE}" >/dev/null
          docker image save --output "${RUNNER_TEMP}/preview-image.tar" "${WORKER_IMAGE}"

      - name: Upload preview image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish_preview:
    needs: build_preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pull-requests: write
    env:
      PREVIEW_IMAGE: index.docker.io/streamarr/streamarr-transcode-worker:pr-${{ github.event.issue.number }}

    steps:
      - name: React to command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Download preview image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image

      - name: Load preview image
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/preview-image/preview-image.tar"
          [[ -f "${archive}" ]] || { echo "Preview image archive is missing" >&2; exit 1; }
          docker image load --input "${archive}"
          docker image inspect "${WORKER_IMAGE}" >/dev/null

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish preview image
        run: |
          set -euo pipefail
          docker tag "${WORKER_IMAGE}" "${PREVIEW_IMAGE}"
          docker push "${PREVIEW_IMAGE}"

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_REVISION: ${{ needs.build_preview.outputs.revision }}
        with:
          script: |
            // The revision comes from the job that ran pull request code.
            const revision = process.env.PREVIEW_REVISION;
            if (!/^[0-9a-f]{40}$/.test(revision)) {
              throw new Error('The build job did not report a full source revision.');
            }
            const tag = `streamarr/streamarr-transcode-worker:pr-${context.issue.number}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview image published from ${revision}:\n\n\`\`\`\ndocker pull ${tag}\n\`\`\``
            });
