name: Sync FFmpeg lock

on:
  pull_request_target:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'buildpacks/ffmpeg/release'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REVIEW_LABEL: ffmpeg-notices-review

jobs:
  capture_buildconf:
    name: Capture ${{ matrix.architecture }} build configuration
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out trusted resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out proposed Renovate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          persist-credentials: false

      - name: Resolve FFmpeg lock from trusted code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_file="${RUNNER_TEMP}/ffmpeg-release"
          git -C proposed show "HEAD:buildpacks/ffmpeg/release" >"${release_file}"
          trusted/buildpacks/ffmpeg/bin/update-lock \
            --root "${GITHUB_WORKSPACE}/trusted" \
            --release-file "${release_file}"

      # The only job that runs the downloaded binary holds no secret and no write permission.
      - name: Capture build configuration from the locked binary
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          trusted/buildpacks/ffmpeg/bin/capture-buildconf \
            --root "${GITHUB_WORKSPACE}/trusted" \
            --architecture "${ARCHITECTURE}" \
            --output "${RUNNER_TEMP}/buildconf-${ARCHITECTURE}.txt"

      - name: Hand the capture to the synchronization job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-buildconf-${{ matrix.architecture }}
          path: ${{ runner.temp }}/buildconf-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 1

  sync_ffmpeg_lock:
    name: Synchronize FFmpeg lock
    needs: capture_buildconf
    # A failed capture must not stop the lock from synchronizing; it only withholds the review.
    if: >-
      !cancelled() &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out proposed Renovate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          persist-credentials: false

      - name: Resolve FFmpeg lock from trusted code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_file="${RUNNER_TEMP}/ffmpeg-release"
          git -C proposed show "HEAD:buildpacks/ffmpeg/release" >"${release_file}"
          trusted/buildpacks/ffmpeg/bin/update-lock \
            --root "${GITHUB_WORKSPACE}/trusted" \
            --release-file "${release_file}"

      - name: Receive captured build configurations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ffmpeg-buildconf-*
          path: ${{ runner.temp }}/buildconf
          merge-multiple: true

      # The captures come from a job that ran upstream's binary, so they are data to be checked.
      - name: Adopt captured build configurations
        run: |
          for architecture in amd64 arm64; do
            capture="${RUNNER_TEMP}/buildconf/buildconf-${architecture}.txt"
            if [[ ! -e "${capture}" ]]; then
              echo "- Build configuration of ${architecture} could not be captured" \
                >>"${RUNNER_TEMP}/ffmpeg-uncaptured"
              continue
            fi
            # grep reads a NUL byte as a line terminator, so it never matches one. Count the
            # bytes outside the banner's alphabet instead of asking whether one matches.
            if [[ ! -f "${capture}" || -L "${capture}" ]] \
              || (( $(wc -c <"${capture}") > 65536 )) \
              || (( $(LC_ALL=C tr -d '[:print:]\n' <"${capture}" | wc -c) > 0 )) \
              || [[ "$(head -n 1 "${capture}")" != 'ffmpeg version '* ]]; then
              echo "Unexpected ${architecture} build configuration capture" >&2
              exit 1
            fi
            cp "${capture}" "trusted/buildpacks/ffmpeg/notices/buildconf-${architecture}.txt"
            echo "buildpacks/ffmpeg/notices/buildconf-${architecture}.txt" \
              >>"${RUNNER_TEMP}/ffmpeg-captured"
          done

      - name: Select the declared Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: trusted/buildpacks/ffmpeg/.nvmrc
          package-manager-cache: false

      # A pin the tool cannot follow still synchronizes the lock and asks a maintainer to look.
      - name: Regenerate notice inputs from trusted code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! node trusted/buildpacks/ffmpeg/bin/vendor-notices.mjs \
            --root "${GITHUB_WORKSPACE}/trusted/buildpacks/ffmpeg" 2>&1 \
            | tee "${RUNNER_TEMP}/ffmpeg-review"; then
            echo "- Notice inputs could not be regenerated; run vendor-notices.mjs locally" \
              >>"${RUNNER_TEMP}/ffmpeg-review"
            exit 0
          fi
          : >"${RUNNER_TEMP}/ffmpeg-regenerated"

      - name: Review locked release from trusted code
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          review="${RUNNER_TEMP}/ffmpeg-review"
          unchanged=true
          if ! grep -q '^Inventory content unchanged' "${review}"; then
            unchanged=false
          fi
          if [[ -e "${RUNNER_TEMP}/ffmpeg-uncaptured" ]]; then
            unchanged=false
            cat "${RUNNER_TEMP}/ffmpeg-uncaptured" >>"${review}"
          fi
          if ! git -C trusted diff --quiet -- 'buildpacks/ffmpeg/notices/buildconf-*.txt'; then
            unchanged=false
            echo "- Build configuration changed; compare notices/buildconf-*.txt" >>"${review}"
          fi

          status=3
          if [[ "${unchanged}" == 'true' ]]; then
            status=0
            # The review quotes upstream file names, and the runner reads `##[command]` anywhere
            # in a logged line. Both streams share the pipe so that none of it outlives the pause.
            resume="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::${resume}"
            trusted/buildpacks/ffmpeg/bin/review-release \
              --root "${GITHUB_WORKSPACE}/trusted" 2>&1 | tee -a "${review}" || status=$?
            echo "::${resume}::"
          fi
          # The report quotes upstream text, so a reader has to meet it as data: a fence longer
          # than any run of backticks inside it cannot be closed from within, and a bounded
          # excerpt fits a comment. The review request posts this same block.
          LC_ALL=C awk -v limit=16384 '
            {
              if (bytes >= limit) { truncated = 1; next }
              line = substr($0, 1, limit - bytes)
              if (line != $0) truncated = 1
              bytes += length($0) + 1
              held[++count] = line
              while (match(line, /`+/)) {
                if (RLENGTH > longest) longest = RLENGTH
                line = substr(line, RSTART + RLENGTH)
              }
            }
            END {
              width = longest < 3 ? 3 : longest + 1
              while (length(fence) < width) fence = fence "`"
              print fence "text"
              for (i = 1; i <= count; i++) print held[i]
              if (truncated) print "[report truncated]"
              print fence
            }
          ' "${review}" >"${RUNNER_TEMP}/ffmpeg-review-block"
          cat "${RUNNER_TEMP}/ffmpeg-review-block" >>"${GITHUB_STEP_SUMMARY}"
          case "${status}" in
            0) echo "reviewed=true" >>"${GITHUB_OUTPUT}" ;;
            3) echo "reviewed=false" >>"${GITHUB_OUTPUT}"
               message="$(jq -Rrs 'rtrimstr("\n") | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' "${review}")"
               echo "::warning title=FFmpeg notice review::${message}" ;;
            *) exit "${status}" ;;
          esac

      - name: Prepare synchronized lock
        id: changes
        env:
          REVIEWED: ${{ steps.review.outputs.reviewed }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          lock=buildpacks/ffmpeg/ffmpeg.lock
          manifest=buildpacks/ffmpeg/notices/manifest
          regenerated="${RUNNER_TEMP}/ffmpeg-regenerated"
          captured="${RUNNER_TEMP}/ffmpeg-captured"
          headline='behavioral: synchronize FFmpeg lock and notice inputs for review'
          if [[ "${REVIEWED}" == 'true' ]]; then
            headline='behavioral: synchronize FFmpeg lock and unchanged notice review'
          fi

          # Only a confirmed review writes the manifest here; an unreviewed run may only withdraw it.
          blobs='[]'
          while IFS= read -r -d '' path; do
            if [[ "${path}" == "${manifest}" && "${REVIEWED}" != 'true' ]]; then
              continue
            fi
            # The trusted checkout still holds the base's copy of everything this run did not
            # write, so only what it produced may replace the head.
            case "${path}" in
              "${lock}") ;;
              buildpacks/ffmpeg/notices/buildconf-*.txt)
                grep -qxF "${path}" "${captured}" 2>/dev/null || continue ;;
              *) [[ -e "${regenerated}" ]] || continue ;;
            esac

            blob="$(git -C proposed hash-object -w "${GITHUB_WORKSPACE}/trusted/${path}")"
            current_blob="$(git -C proposed rev-parse "HEAD:${path}" 2>/dev/null || true)"
            if [[ "${blob}" == "${current_blob}" ]]; then
              continue
            fi
            if [[ "${path}" != "${lock}" && "${SENDER}" != 'renovate[bot]' ]]; then
              # Everything but the lock derives from the base, so it may only replace a head that
              # nobody has edited: Renovate rebuilds its branch from the base, while anyone else's
              # push may carry a correction or a manifest a maintainer meant to keep.
              echo "::warning title=FFmpeg notice review::${path} differs from this run's output and stays as pushed"
              continue
            fi

            blobs="$(jq -c --arg path "${path}" --arg blob "${blob}" \
              '. + [{path: $path, blob: $blob}]' <<<"${blobs}")"
          done < <(cd trusted && find buildpacks/ffmpeg/ffmpeg.lock buildpacks/ffmpeg/SOURCE.txt \
            buildpacks/ffmpeg/notices -type f -print0)

          # Only a regenerated inventory says which notices no longer belong to it.
          deletions='[]'
          if [[ -e "${regenerated}" ]]; then
            while IFS= read -r path; do
              if [[ ! -e "trusted/${path}" ]]; then
                deletions="$(jq -c --arg path "${path}" '. + [{path: $path}]' <<<"${deletions}")"
              fi
            done < <(git -C proposed ls-tree -r --name-only HEAD -- buildpacks/ffmpeg/notices)
          fi

          # An approval covers the content it was submitted on, so a commit that adds anything else
          # withdraws the binding in the same commit: the base's manifest names the previous
          # release, CI goes red again, and the next approval binds this head for real.
          if [[ "${REVIEWED}" != 'true' && ( "${blobs}" != '[]' || "${deletions}" != '[]' ) ]]; then
            bound="$(git -C proposed rev-parse "HEAD:${manifest}" 2>/dev/null || true)"
            blob="$(git -C proposed hash-object -w "${GITHUB_WORKSPACE}/trusted/${manifest}")"
            if [[ "${blob}" != "${bound}" ]]; then
              blobs="$(jq -c --arg path "${manifest}" --arg blob "${blob}" \
                '. + [{path: $path, blob: $blob}]' <<<"${blobs}")"
            fi
          fi

          approved=false
          lock="$(git -C proposed hash-object "${GITHUB_WORKSPACE}/trusted/buildpacks/ffmpeg/ffmpeg.lock")"
          if [[ "${REVIEWED}" != 'true' && "${blobs}" == '[]' && "${deletions}" == '[]' \
            && "$(git -C proposed rev-parse HEAD:buildpacks/ffmpeg/ffmpeg.lock)" == "${lock}" ]] \
            && trusted/buildpacks/ffmpeg/bin/update-lock --check --root "${GITHUB_WORKSPACE}/proposed" \
              >/dev/null 2>&1; then
            approved=true
          fi

          {
            echo "blobs=${blobs}"
            echo "deletions=${deletions}"
            echo "headline=${headline}"
            echo "approved=${approved}"
          } >>"${GITHUB_OUTPUT}"
          if [[ "${blobs}" == '[]' && "${deletions}" == '[]' ]]; then
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "changed=true" >>"${GITHUB_OUTPUT}"

      - name: Verify Renovate head is unchanged
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git check-ref-format "refs/heads/${HEAD_REF}"
          checked_out_sha="$(git -C proposed rev-parse HEAD)"
          current_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "${checked_out_sha}" != "${EXPECTED_HEAD_SHA}" \
            || "${current_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "Renovate head moved while resolving the FFmpeg lock" >&2
            exit 1
          fi

      - name: Mint lock bot token
        if: steps.changes.outputs.changed == 'true'
        id: lock_bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ORG_STREAMARR_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.ORG_STREAMARR_RELEASE_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit synchronized lock
        if: steps.changes.outputs.changed == 'true'
        working-directory: proposed
        env:
          GH_TOKEN: ${{ steps.lock_bot.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BLOBS: ${{ steps.changes.outputs.blobs }}
          DELETIONS: ${{ steps.changes.outputs.deletions }}
          HEADLINE: ${{ steps.changes.outputs.headline }}
        run: |
          additions="${RUNNER_TEMP}/ffmpeg-additions.json"
          contents="${RUNNER_TEMP}/ffmpeg-contents"
          echo '[]' >"${additions}"
          while IFS=$'\t' read -r path blob; do
            git cat-file blob "${blob}" | base64 -w 0 >"${contents}"
            jq --arg path "${path}" --rawfile contents "${contents}" \
              '. + [{path: $path, contents: $contents}]' "${additions}" >"${additions}.next"
            mv "${additions}.next" "${additions}"
          done < <(jq -r '.[] | [.path, .blob] | @tsv' <<<"${BLOBS}")
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${HEAD_REF}" \
            --arg expectedHead "${EXPECTED_HEAD_SHA}" \
            --arg headline "${HEADLINE}" \
            --argjson deletions "${DELETIONS}" \
            --slurpfile additions "${additions}" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                expectedHeadOid: $expectedHead,
                message: {headline: $headline},
                fileChanges: {additions: $additions[0], deletions: $deletions}
              }}}' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit | {oid, url}'

      # Labels and comments use the workflow token, which cannot trigger further workflows.
      - name: Request maintainer review of a changed inventory
        if: steps.review.outputs.reviewed != 'true' && steps.changes.outputs.approved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "${REVIEW_LABEL}" --repo "${GITHUB_REPOSITORY}" --force --color D93F0B \
            --description 'FFmpeg notice inventory changed; an approving review binds notices/manifest'
          gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --add-label "${REVIEW_LABEL}"
          {
            cat <<'MARKDOWN'
          ### FFmpeg notice inventory needs a maintainer review

          MARKDOWN
            cat "${RUNNER_TEMP}/ffmpeg-review-block"
            printf '\n'
            # An approval binds only inputs that describe the locked release, so a run that
            # regenerated none has to ask for them before it can ask for the review.
            if [[ ! -e "${RUNNER_TEMP}/ffmpeg-regenerated" ]]; then
              cat <<'MARKDOWN'
          This run committed only `buildpacks/ffmpeg/ffmpeg.lock` and left `notices/` and
          `SOURCE.txt` as this branch holds them. Regenerate them on the locked release and push
          them to this branch, which later runs keep as pushed:

              nvm use "$(cat buildpacks/ffmpeg/.nvmrc)"
              node buildpacks/ffmpeg/bin/vendor-notices.mjs

          MARKDOWN
            fi
            cat <<'MARKDOWN'
          Read this pull request's diff of `buildpacks/ffmpeg/notices` and `SOURCE.txt`.
          Submit an **approving review** to bind `notices/manifest`; CI stays red until then.
          MARKDOWN
          } >"${RUNNER_TEMP}/ffmpeg-comment.md"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --edit-last --create-if-none \
            --body-file "${RUNNER_TEMP}/ffmpeg-comment.md"

      - name: Clear a review request that no longer applies
        if: steps.review.outputs.reviewed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --remove-label "${REVIEW_LABEL}" || true
